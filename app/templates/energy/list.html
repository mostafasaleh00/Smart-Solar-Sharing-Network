{% extends "base.html" %}

{% block title %}List Energy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">List Available Energy</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (kWh)</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Price per kWh ($)</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" 
                               value="{{ predicted_price|round(2) if predicted_price else '' }}" required>
                        {% if predicted_price %}
                        <div class="form-text text-info">
                            Suggested price based on current market conditions: ${{ predicted_price|round(2) }}/kWh
                        </div>
                        {% endif %}
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">List Energy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
