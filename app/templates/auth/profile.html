{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card animate-fade-in">
            <div class="card-body text-center">
                <!-- Profile Picture Section -->
                <div class="mb-4">
                    {% if current_user.profile_picture %}
                        <img src="{{ url_for('static', filename='uploads/' + current_user.profile_picture) }}" 
                             alt="Profile" class="profile-picture-lg">
                    {% else %}
                        <img src="{{ url_for('static', filename='img/default-profile.png') }}" 
                             alt="Profile" class="profile-picture-lg">
                    {% endif %}
                    
                    <form action="{{ url_for('auth.upload_profile_picture') }}" method="POST" 
                          enctype="multipart/form-data" class="mt-2">
                        <div class="d-flex justify-content-center align-items-center gap-2">
                            <input type="file" name="profile_picture" class="form-control" 
                                   accept="image/*" required style="max-width: 300px;">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-upload"></i> Upload
                            </button>
                        </div>
                    </form>
                </div>

                <!-- User Information -->
                <h3 class="mb-3">{{ current_user.name }}</h3>
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card stats-card mb-3">
                            <div class="card-body">
                                <p class="mb-2">
                                    <i class="fas fa-envelope icon-green"></i> 
                                    {{ current_user.email }}
                                </p>
                                <p class="mb-2">
                                    <i class="fas fa-user-tag icon-green"></i> 
                                    {{ current_user.role|title }}
                                </p>
                                <p class="mb-0">
                                    <i class="fas fa-map-marker-alt icon-green"></i> 
                                    {{ current_user.location }}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Update Profile Form -->
                <form method="POST" action="{{ url_for('auth.update_profile') }}" class="mt-4">
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="{{ current_user.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" name="location" 
                                       value="{{ current_user.location }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">New Password (optional)</label>
                                <input type="password" class="form-control" id="password" name="password" 
                                       minlength="8">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Profile
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
